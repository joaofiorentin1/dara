[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dara-agent"
version = "0.1.0"
description = "Data Anomaly Root-cause Agent — autonomous RCA for Airflow + dbt + BigQuery pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "fiorentinjoao" }]
keywords = ["data-engineering", "airflow", "dbt", "bigquery", "ai-agent", "rca"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "google-cloud-bigquery>=3.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
dara = "dara.cli:app"

[project.urls]
Homepage = "https://github.com/fiorentinjoao/dara"
Repository = "https://github.com/fiorentinjoao/dara"
Issues = "https://github.com/fiorentinjoao/dara/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
